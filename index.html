<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowing Zen 3.0</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent: #4caf50;
            --accent-hover: #45a049;
            --accent-secondary: #ff9800;
            --danger: #f44336;
            --border: #333;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
        }

        .column {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent);
        }

        textarea { resize: vertical; min-height: 120px; }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); }
        .btn-hint { background: var(--accent-secondary); margin-top: 10px; display: none; width: 100%; }
        .btn-hint:hover { background: #e68a00; }
        .btn-delete { background: var(--danger); padding: 6px 10px; font-size: 0.8rem; }

        .speed-controls { display: flex; gap: 5px; flex-wrap: wrap; }
        .speed-controls button { flex: 1; min-width: 45px; background: var(--border); color: var(--text-main); padding: 8px; font-size: 0.85rem;}
        .speed-controls button.active { background: var(--accent); }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        #active-mode-container {
            display: none;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        #exercise-area {
            display: none;
            flex-direction: column;
            gap: 15px;
            background: var(--bg-dark);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .sentence-display {
            font-size: 1.5rem;
            min-height: 60px;
            margin-bottom: 10px;
            line-height: 1.8;
            text-align: center;
        }

        .word-hidden {
            color: transparent;
            border-bottom: 2px solid var(--text-muted);
            margin: 0 4px;
            display: inline-block;
            min-width: 40px;
        }

        .word-revealed {
            color: var(--accent);
            margin: 0 4px;
            font-weight: 500;
            cursor: help;
            border-bottom: 1px dashed transparent;
            transition: border-bottom 0.2s;
        }

        .word-revealed:hover {
            border-bottom: 1px dashed var(--accent);
        }

        .hover-sentence {
            font-size: 0.9rem;
            color: var(--accent-secondary);
            cursor: help;
            margin-left: 10px;
            font-weight: bold;
        }

        .inline-blank {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--accent);
            color: #fff;
            font-size: 1.4rem;
            text-align: center;
            outline: none;
            margin: 0 5px;
            padding: 0;
            transition: border-color 0.2s;
        }
        
        .inline-blank:focus {
            border-bottom: 2px solid #fff;
            background: rgba(255,255,255,0.1);
        }

        .target-indicator {
            font-size: 0.9rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: -5px;
            display: none;
        }

        /* Çeviri Tooltip (Hover) */
        #translation-tooltip {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid var(--accent);
            max-width: 300px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .notebook-section {
            width: 100%;
            max-width: 1200px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .notebook-inputs { display: flex; gap: 10px; margin-bottom: 15px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 500; }
        td { vertical-align: middle; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .notebook-inputs { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Tooltip Kutusu -->
    <div id="translation-tooltip">Çevriliyor...</div>

    <div class="container">
        <!-- Sol Sütun: Video -->
        <div class="column">
            <h2>Video Oynatıcı</h2>
            <div style="background: rgba(76, 175, 80, 0.1); padding: 10px; font-size: 0.85rem; color: #bbb;">
                💡 <b>Kısayol:</b> Metin yazarken videoyu durdurmak/başlatmak için <b>Ctrl + Boşluk (Space)</b> tuşlarına basın.
            </div>
            <input type="text" id="vid-link" placeholder="YouTube veya TEDx Linkini Yapıştırın...">
            <button onclick="loadVideo()">Videoyu Yükle</button>
            
            <div class="video-container" id="player-container"></div>
            
            <div class="speed-controls" id="speed-controls" style="display:none;">
                <button onclick="setSpeed(0.25)" id="btn-025">0.25x</button>
                <button onclick="setSpeed(0.50)" id="btn-050">0.50x</button>
                <button onclick="setSpeed(0.75)" id="btn-075">0.75x</button>
                <button onclick="setSpeed(1)" id="btn-1" class="active">1x (Normal)</button>
                <button onclick="setSpeed(1.25)" id="btn-125">1.25x</button>
            </div>
        </div>

        <!-- Sağ Sütun: Egzersiz -->
        <div class="column">
            <h2>Transkript ve Çalışma Alanı</h2>
            
            <!-- Aktif Mod Değiştirici (Egzersiz başladıktan sonra görünür) -->
            <div id="active-mode-container">
                <label style="font-size: 0.9rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Çalışma Modunu Anında Değiştir:</label>
                <select id="live-mode-select" onchange="changeModeLive()">
                    <option value="word">Kelime Modu (Sırayla yaz)</option>
                    <option value="blank">Boşluk Doldurma Modu</option>
                    <option value="sentence">Cümle Modu (Tamamını yaz)</option>
                </select>
            </div>

            <div id="setup-area">
                <textarea id="transcript" placeholder="Transkripti buraya yapıştırın..."></textarea>
                <button onclick="startExercise()" style="width:100%; margin-top:10px;">Egzersizi Başlat</button>
            </div>

            <div id="exercise-area">
                <div class="target-indicator" id="target-indicator">Şu kelimeyi yazın: <b></b></div>
                <div class="sentence-display" id="sentence-display"></div>
                <input type="text" id="exercise-input" placeholder="Buraya yazın..." autocomplete="off">
                <button id="hint-btn" class="btn-hint" onclick="giveHint()">💡 İpucu (Sıradaki Kelimeyi Göster)</button>
                <button onclick="nextSentence()" id="next-btn" style="display: none; width: 100%;">Sonraki Cümleye Geç (Enter)</button>
            </div>
        </div>
    </div>

    <!-- Alt Kısım: Kelime Defteri -->
    <div class="notebook-section">
        <h2>Kelime ve Cümle Defteri (Zen Vocab)</h2>
        <div class="notebook-inputs">
            <input type="text" id="vocab-word" placeholder="Kelime veya Cümle girin..." style="flex: 1;">
            <input type="text" id="vocab-meaning" placeholder="Anlamı..." style="flex: 1;">
            <button onclick="addVocab()">Deftere Ekle</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width:25%">Kelime / Cümle</th>
                    <th style="width:25%">Anlamı</th>
                    <th style="width:40%">Örnek (Çalışılan Cümle)</th>
                    <th style="width:10%">İşlem</th>
                </tr>
            </thead>
            <tbody id="vocab-list"></tbody>
        </table>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let ytPlayer = null;
        let currentVideoType = null; 
        
        let sentences = [];
        let currentSentenceIndex = 0;
        let currentMode = 'word';
        let targetWords = [];
        let currentWordIndex = 0;
        let originalSentence = "";
        let blanksToFill = 0;

        // Video Yükleme
        function loadVideo() {
            const url = document.getElementById('vid-link').value.trim();
            const container = document.getElementById('player-container');
            const speedControls = document.getElementById('speed-controls');
            
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]+)/);
            const tedMatch = url.match(/ted\.com\/talks\/([^?]+)/);

            if (ytMatch) {
                const videoID = ytMatch[1];
                currentVideoType = 'youtube';
                speedControls.style.display = 'flex';
                container.innerHTML = `<iframe id="yt-iframe" src="https://www.youtube.com/embed/${videoID}?enablejsapi=1&rel=0&autoplay=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                
                setTimeout(() => {
                    ytPlayer = new YT.Player('yt-iframe', { events: { 'onReady': () => setSpeed(1) } });
                }, 500);
            } else if (tedMatch) {
                const tedID = tedMatch[1];
                currentVideoType = 'ted';
                speedControls.style.display = 'none';
                ytPlayer = null;
                container.innerHTML = `<iframe src="https://embed.ted.com/talks/${tedID}" allowfullscreen></iframe>`;
            } else {
                alert('Lütfen geçerli bir YouTube veya TEDx linki giriniz.');
            }
        }

        // Hız Kontrolü
        function setSpeed(speed) {
            if (currentVideoType === 'youtube' && ytPlayer && typeof ytPlayer.setPlaybackRate === 'function') {
                ytPlayer.setPlaybackRate(speed);
            }
            document.querySelectorAll('.speed-controls button').forEach(btn => btn.classList.remove('active'));
            if(speed === 0.25) document.getElementById('btn-025').classList.add('active');
            if(speed === 0.50) document.getElementById('btn-050').classList.add('active');
            if(speed === 0.75) document.getElementById('btn-075').classList.add('active');
            if(speed === 1) document.getElementById('btn-1').classList.add('active');
            if(speed === 1.25) document.getElementById('btn-125').classList.add('active');
        }

        // --- Çeviri Sistemi (Hover) ---
        const translationCache = {};
        let tooltipTimeout;

        document.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('word-revealed') || e.target.classList.contains('hover-sentence')) {
                const textToTranslate = e.target.dataset.text;
                if (!textToTranslate) return;
                
                const tooltip = document.getElementById('translation-tooltip');
                tooltip.style.display = 'block';
                tooltip.innerHTML = "Çevriliyor...";
                
                // Konumlandırma
                tooltip.style.left = (e.pageX + 10) + 'px';
                tooltip.style.top = (e.pageY + 20) + 'px';

                if (translationCache[textToTranslate]) {
                    tooltip.innerHTML = translationCache[textToTranslate];
                    return;
                }

                clearTimeout(tooltipTimeout);
                tooltipTimeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textToTranslate)}&langpair=en|tr`);
                        const data = await res.json();
                        const translated = data.responseData.translatedText;
                        translationCache[textToTranslate] = translated;
                        tooltip.innerHTML = translated;
                    } catch(err) {
                        tooltip.innerHTML = "Çeviri alınamadı.";
                    }
                }, 400); // 400ms bekle (Gereksiz API isteklerini engellemek için)
            }
        });

        document.addEventListener('mouseout', (e) => {
            if (e.target.classList.contains('word-revealed') || e.target.classList.contains('hover-sentence')) {
                clearTimeout(tooltipTimeout);
                document.getElementById('translation-tooltip').style.display = 'none';
            }
        });

        // --- Egzersiz Mantığı ---
        function startExercise() {
            const rawText = document.getElementById('transcript').value.trim();
            if (!rawText) return;

            sentences = rawText.match(/[^.!?]+[.!?]+/g) || [rawText];
            sentences = sentences.map(s => s.trim().replace(/\n/g, ' ')).filter(s => s.length > 0);
            if (sentences.length === 0) return;

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('active-mode-container').style.display = 'block';
            document.getElementById('exercise-area').style.display = 'flex';
            
            currentMode = document.getElementById('live-mode-select').value;
            currentSentenceIndex = 0;
            renderSentence();
        }

        function changeModeLive() {
            currentMode = document.getElementById('live-mode-select').value;
            // Mevcut cümleyi yeni moda göre sıfırla ve yeniden çiz
            renderSentence();
        }

        function cleanText(text) {
            return text.toLowerCase().replace(/[^a-z0-9']/g, "");
        }

        function renderSentence() {
            const displayDiv = document.getElementById('sentence-display');
            const inputField = document.getElementById('exercise-input');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('target-indicator');
            const hintBtn = document.getElementById('hint-btn');

            hintBtn.style.display = 'none';

            if (currentSentenceIndex >= sentences.length) {
                displayDiv.innerHTML = "<span style='color:var(--accent)'>Tebrikler! Metni tamamladınız. 🎉</span>";
                inputField.style.display = 'none';
                indicator.style.display = 'none';
                nextBtn.style.display = 'none';
                return;
            }

            originalSentence = sentences[currentSentenceIndex];
            targetWords = originalSentence.split(' ').filter(w => w.length > 0);
            
            inputField.value = '';
            inputField.style.display = 'block';
            inputField.style.borderColor = 'var(--border)';
            nextBtn.style.display = 'none';
            indicator.style.display = 'none';
            
            // KELİME MODU
            if (currentMode === 'word') {
                currentWordIndex = 0;
                indicator.style.display = 'block';
                updateWordModeDisplay();
                inputField.focus();
                
                inputField.oninput = (e) => {
                    const typed = e.target.value.trim();
                    const targetClean = cleanText(targetWords[currentWordIndex]);
                    
                    if (cleanText(typed) === targetClean) {
                        currentWordIndex++;
                        e.target.value = '';
                        updateWordModeDisplay();
                        
                        if (currentWordIndex >= targetWords.length) finishSentenceUI();
                    }
                };
                inputField.onkeydown = null;
            } 
            // CÜMLE MODU
            else if (currentMode === 'sentence') {
                displayDiv.innerHTML = "<span style='color:var(--text-muted); font-style:italic;'>Cümleyi dinleyin ve tamamını aşağıya yazıp Enter'a basın...</span>";
                inputField.focus();
                
                inputField.oninput = null;
                inputField.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        const typed = inputField.value.trim();
                        if (cleanText(originalSentence) === cleanText(typed)) {
                            // Cümle doğru yazıldığında kelimeleri çevrilebilir formatta göster
                            let html = targetWords.map(w => `<span class="word-revealed" data-text="${w}">${w}</span>`).join(' ');
                            html += ` <span class="hover-sentence" data-text="${originalSentence}">[🌐 Cümleyi Çevir]</span>`;
                            displayDiv.innerHTML = html;
                            finishSentenceUI();
                        } else {
                            inputField.style.borderColor = "var(--danger)";
                            setTimeout(() => inputField.style.borderColor = "var(--border)", 500);
                        }
                    }
                };
            }
            // BOŞLUK DOLDURMA MODU
            else if (currentMode === 'blank') {
                inputField.style.display = 'none'; 
                hintBtn.style.display = 'block'; // İpucu butonunu göster
                
                const blankIndices = new Set();
                const numBlanks = Math.max(1, Math.floor(targetWords.length * 0.35));
                while(blankIndices.size < numBlanks) {
                    blankIndices.add(Math.floor(Math.random() * targetWords.length));
                }

                blanksToFill = numBlanks;
                let html = "";
                
                targetWords.forEach((word, idx) => {
                    if (blankIndices.has(idx)) {
                        const cleanTarget = cleanText(word);
                        const width = Math.max(40, word.length * 15);
                        html += `<input type="text" class="inline-blank" data-target="${cleanTarget}" data-original="${word}" style="width:${width}px"> `;
                    } else {
                        html += `<span class="word-revealed" data-text="${word}">${word}</span> `;
                    }
                });
                
                // Cümle sonu çeviri simgesi (Tamamlanınca tam aktif olur ama durabilir)
                html += ` <span class="hover-sentence" data-text="${originalSentence}" style="display:none;" id="sentence-translate-icon">[🌐 Cümleyi Çevir]</span>`;
                displayDiv.innerHTML = html.trim();
                
                const firstBlank = document.querySelector('.inline-blank');
                if(firstBlank) firstBlank.focus();

                document.querySelectorAll('.inline-blank').forEach(inp => {
                    inp.addEventListener('input', (e) => {
                        if (cleanText(e.target.value) === e.target.dataset.target) {
                            revealBlank(e.target);
                        }
                    });
                });
            }
        }

        function revealBlank(inputElement) {
            const word = inputElement.dataset.original;
            const wordHTML = `<span class="word-revealed" data-text="${word}">${word}</span>`;
            inputElement.outerHTML = wordHTML;
            blanksToFill--;
            
            if (blanksToFill <= 0) {
                document.getElementById('sentence-translate-icon').style.display = 'inline-block';
                finishSentenceUI();
            } else {
                const nextBlank = document.querySelector('.inline-blank');
                if(nextBlank) nextBlank.focus();
            }
        }

        function giveHint() {
            // Sadece boşluk doldurma modunda çalışır
            const currentBlank = document.querySelector('.inline-blank');
            if(currentBlank) {
                // Input değerini direkt doğru kelime ile değiştir ve tetikle
                currentBlank.value = currentBlank.dataset.original;
                revealBlank(currentBlank);
            }
        }

        function updateWordModeDisplay() {
            let html = "";
            const indicator = document.getElementById('target-indicator');
            
            if(currentWordIndex < targetWords.length) {
                indicator.innerHTML = `Sıradaki kelime: <b>${targetWords[currentWordIndex].replace(/[a-zA-Z]/g, '_ ')}</b>`;
            }

            targetWords.forEach((word, index) => {
                if (index < currentWordIndex) {
                    html += `<span class="word-revealed" data-text="${word}">${word}</span> `;
                } else {
                    html += `<span class="word-hidden">${word}</span> `;
                }
            });

            // Eğer cümle bittiyse genel çeviri butonunu ekle
            if(currentWordIndex >= targetWords.length) {
                 html += ` <span class="hover-sentence" data-text="${originalSentence}">[🌐 Cümleyi Çevir]</span>`;
            }

            document.getElementById('sentence-display').innerHTML = html.trim();
        }

        function finishSentenceUI() {
            document.getElementById('target-indicator').style.display = 'none';
            document.getElementById('exercise-input').style.display = 'none';
            document.getElementById('hint-btn').style.display = 'none';
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'block';
            nextBtn.focus();
        }

        function nextSentence() {
            currentSentenceIndex++;
            renderSentence();
        }

        // --- Defter Mantığı ---
        function addVocab() {
            const word = document.getElementById('vocab-word').value.trim();
            const meaning = document.getElementById('vocab-meaning').value.trim();
            if (!word) return;

            const table = document.getElementById('vocab-list');
            const row = document.createElement('tr');
            const example = originalSentence ? originalSentence : "-";

            row.innerHTML = `
                <td><strong>${word}</strong></td>
                <td>${meaning}</td>
                <td style="color:var(--text-muted); font-style:italic; font-size:0.9rem;">${example}</td>
                <td><button class="btn-delete" onclick="this.closest('tr').remove()">Sil</button></td>
            `;
            
            table.prepend(row);
            document.getElementById('vocab-word').value = '';
            document.getElementById('vocab-meaning').value = '';
            document.getElementById('vocab-word').focus();
        }

        // --- Global Klavye Kısayolları ---
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                if (document.activeElement.id === 'vocab-word' || document.activeElement.id === 'vocab-meaning') {
                    addVocab();
                } else if (document.getElementById('next-btn').style.display === 'block') {
                    nextSentence();
                }
            }
            
            if (event.ctrlKey && event.code === 'Space') {
                event.preventDefault();
                if (currentVideoType === 'youtube' && ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                    const state = ytPlayer.getPlayerState();
                    if (state === 1) ytPlayer.pauseVideo();
                    else ytPlayer.playVideo();
                }
            }
        });
    </script>
</body>
</html>
